# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Build release
      run: swift build -c release -v
    - name: Multi-part download smoke test
      run: |
        .build/release/bigdl https://testfile.to/dl/100mb test.bin --async
        test -f test.bin
        actual_size=$(stat -f%z test.bin)
        min_size=$((90 * 1000 * 1000))
        if [ "$actual_size" -lt "$min_size" ]; then
          echo "expected test.bin to be at least $min_size bytes, got $actual_size"
          exit 1
        fi
